<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>演出提示单 · 小剧场排练</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <h1>🎭 演出提示单 <span class="sub">小剧场排练用</span></h1>
      <p class="hint">区间按<strong>左闭右开 [开始, 结束)</strong>绘制；同一独占通道时间重叠会标红冲突，首尾相接不算冲突。冲突允许保留，供排练现场调整。</p>
    </div>
  </header>

  <main class="wrap">
    <div id="banner" class="banner hidden"></div>

    <section class="panel">
      <div class="panel-head">
        <h2 id="timelineTitle">时间轴（按通道）</h2>
        <div class="legend">
          <span class="lg lg-ok"></span> 正常
          <span class="lg lg-bad"></span> 冲突时段
          <span class="lg lg-unknown"></span> 时间未定（引用/环问题）
        </div>
      </div>
      <div id="timeline"></div>
    </section>

    <section class="panel" id="conflictPanel" hidden>
      <h2>⚠️ 通道冲突（可保留，仅作排练提醒）</h2>
      <ul id="conflictList" class="conflict-list"></ul>
    </section>

    <section class="panel">
      <h2 id="formTitle">➕ 新增提示</h2>
      <form id="cueForm" class="cue-form">
        <input type="hidden" id="f-id" />
        <div class="grid">
          <label>名称
            <input type="text" id="f-name" maxlength="80" placeholder="例如：第一幕追光" required />
          </label>
          <label>独占设备通道
            <input type="text" id="f-channel" maxlength="40" placeholder="例如：灯光台 A / 调音台 M" required />
          </label>
          <label>持续秒数
            <input type="number" id="f-duration" min="0" step="0.1" placeholder="秒" required />
          </label>
        </div>

        <fieldset class="start-box">
          <legend>开始时间</legend>
          <div class="seg">
            <label><input type="radio" name="startType" value="fixed" checked /> 固定演出秒数</label>
            <label><input type="radio" name="startType" value="after" /> 另一提示结束后</label>
          </div>
          <div id="fixedBox" class="start-detail">
            <label>从演出开始第
              <input type="number" id="f-fixedAt" min="0" step="0.1" value="0" /> 秒
            </label>
          </div>
          <div id="afterBox" class="start-detail" hidden>
            <label>在
              <select id="f-afterCueId"></select>
              结束后
            </label>
            <label>延迟
              <input type="number" id="f-delayAfter" min="0" step="0.1" value="0" /> 秒开始
            </label>
          </div>
        </fieldset>

        <div class="form-actions">
          <button type="submit" id="submitBtn" class="btn primary">保存新增</button>
          <button type="button" id="cancelEdit" class="btn ghost" hidden>取消编辑</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <h2>提示列表</h2>
      <div class="table-wrap">
        <table id="cueTable">
          <thead>
            <tr>
              <th>#</th><th>名称</th><th>独占通道</th><th>持续(s)</th><th>开始方式</th><th>重算开始</th><th>结束(s)</th><th>状态</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="cueTbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
